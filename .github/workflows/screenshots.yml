name: Screenshots

# Manual: boots the compose stack, captures real screenshots of the demo data with
# headless Chromium and uploads them as an artifact (to be committed under docs/screenshots/).
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: '20'
      - name: Start the stack
        run: docker compose up --build --detach --wait --wait-timeout 300
      - name: Install Playwright
        run: |
          npm install --no-save --no-audit --no-fund playwright
          npx playwright install --with-deps chromium
      - name: Capture
        run: node scripts/screenshots.js
      - uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: docs/screenshots/*.png
      - name: Tear down
        if: always()
        run: docker compose down -v
